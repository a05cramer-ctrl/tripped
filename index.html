<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRIPPED</title>
<meta name="description" content="he ate the whole thing. $TRIP">
<meta property="og:title" content="TRIPPED">
<meta property="og:description" content="he ate the whole thing. $TRIP">
<meta property="og:image" content="assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/pfp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&family=Rubik+Mono+One&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#06070d; --ink:#f4f1ea; --mute:#b9b4a8;
    --pink:#ff4fd8; --cyan:#3af0ff; --lime:#b6ff3a; --orange:#ff9a3a; --violet:#8b5cff;
    --wob:0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overflow-x:clip;font-family:"DM Mono",ui-monospace,monospace;-webkit-font-smoothing:antialiased;touch-action:none}
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}

  #gl{position:fixed;inset:0;display:block;width:100%;height:100%}
  #trail{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:5;mix-blend-mode:screen}

  /* letterbox */
  .bar{position:fixed;left:0;right:0;height:12vh;background:#000;z-index:20;transition:transform 1.1s cubic-bezier(.7,0,.2,1)}
  .bar.top{top:0;transform:translateY(0)} .bar.bot{bottom:0;transform:translateY(0)}
  body.live .bar.top{transform:translateY(-100%)} body.live .bar.bot{transform:translateY(100%)}

  /* intro overlays */
  #black{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center;transition:opacity 1.4s ease}
  #black.off{opacity:0;pointer-events:none}
  #black .line{font-size:clamp(14px,2vw,22px);color:var(--mute);letter-spacing:.02em;white-space:pre}
  #black .line::after{content:"▌";animation:blink 1s steps(1) infinite;margin-left:2px}
  @keyframes blink{50%{opacity:0}}

  #flash{position:fixed;inset:0;background:#fff;z-index:29;opacity:0;pointer-events:none}
  #cap{position:fixed;left:50%;bottom:16vh;transform:translateX(-50%);z-index:25;font-size:clamp(14px,1.8vw,20px);color:var(--ink);text-shadow:0 2px 12px #000;opacity:0;transition:opacity .5s;white-space:nowrap;pointer-events:none}
  #cap.on{opacity:1}

  #title{position:fixed;inset:0;z-index:26;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .6s}
  #title.on{opacity:1}
  #title h1{font-family:"Rubik Glitch","Rubik Mono One",sans-serif;font-weight:400;font-size:clamp(64px,16vw,220px);line-height:.9;letter-spacing:.02em;color:var(--ink);
    text-shadow:4px 0 var(--pink),-4px 0 var(--cyan),0 0 40px rgba(255,79,216,.35);animation:tilt 3.2s ease-in-out infinite}
  #title .tick{margin-top:1.2vh;font-family:"Rubik Mono One",monospace;font-size:clamp(16px,3vw,34px);color:var(--lime);text-shadow:2px 0 var(--pink),-2px 0 var(--cyan)}
  @keyframes tilt{0%,100%{transform:rotate(-2.5deg) scale(1)}50%{transform:rotate(2.5deg) scale(1.04)}}

  #enter{position:fixed;left:50%;bottom:17vh;transform:translateX(-50%);z-index:27;opacity:0;pointer-events:none;transition:opacity .6s}
  #enter.on{opacity:1;pointer-events:auto}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);font-size:15px;letter-spacing:.08em;text-transform:uppercase;transition:background .2s,transform .2s}
  .pill:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
  .pill.big{padding:18px 30px;font-size:17px;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .kbd{font-size:12px;padding:2px 6px;border:1px solid rgba(255,255,255,.5);border-radius:4px}

  #skip{position:fixed;top:14vh;right:22px;z-index:28;opacity:0;transition:opacity .4s;font-size:12px;letter-spacing:.2em;padding:10px 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.35)}
  #skip.on{opacity:1}
  #snd{position:fixed;top:14vh;left:22px;z-index:28;font-size:12px;letter-spacing:.2em;padding:10px 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.35)}
  body.live #snd{top:22px}
  body.live #skip{display:none}

  /* live UI */
  #ui{position:fixed;inset:0;z-index:15;pointer-events:none;opacity:0;transition:opacity .9s .5s}
  body.live #ui{opacity:1}
  #ui > *{pointer-events:auto}
  .wob{animation:wob 4s ease-in-out infinite}
  @keyframes wob{0%,100%{transform:translate(0,0) rotate(calc(var(--wob)*-1deg))}50%{transform:translate(calc(var(--wob)*2px),calc(var(--wob)*-3px)) rotate(calc(var(--wob)*1deg))}}

  #brand{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-family:"Rubik Glitch","Rubik Mono One",sans-serif;font-size:clamp(28px,5vw,54px);line-height:1;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan);pointer-events:none;white-space:nowrap}
  #brand small{display:block;text-align:center;font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.3em;color:var(--lime);text-shadow:none;margin-top:6px}

  #meter{position:absolute;top:22px;right:22px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  #meter .lab{font-size:11px;letter-spacing:.25em;color:var(--mute)}
  #meter .segs{display:flex;gap:6px}
  #meter .seg{width:34px;height:16px;border:1px solid rgba(255,255,255,.5);border-radius:3px;background:rgba(0,0,0,.3);transition:background .3s,box-shadow .3s}
  #meter .seg.on{background:var(--lime);box-shadow:0 0 14px var(--lime)}
  #meter .seg:nth-child(4).on{background:var(--orange);box-shadow:0 0 14px var(--orange)}
  #meter .seg:nth-child(5).on{background:var(--pink);box-shadow:0 0 18px var(--pink)}
  #meter .hint{font-size:11px;letter-spacing:.15em;color:var(--mute)}

  #dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
  #ca{display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);font-size:13px;letter-spacing:.04em;max-width:min(420px,calc(100vw - 32px))}
  #ca .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  #ca .k{color:var(--lime);letter-spacing:.2em;font-size:11px}
  #ca .cp{color:var(--cyan);letter-spacing:.2em;font-size:11px}
  .dock-btn{padding:12px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.45);font-size:12px;letter-spacing:.2em;text-transform:uppercase;transition:background .2s}
  .dock-btn:hover{background:rgba(255,255,255,.16)}
  .dock-btn.buy{background:var(--lime);color:#111;border-color:var(--lime)}
  .dock-btn.buy:hover{background:#d4ff7a}

  #sober{position:absolute;left:22px;bottom:22px;font-size:11px;letter-spacing:.25em;padding:10px 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(0,0,0,.35)}

  #bubble{position:fixed;z-index:16;pointer-events:none;opacity:0;transition:opacity .25s;transform:translate(-50%,-115%);background:#fff;color:#111;font-size:14px;padding:10px 14px;border-radius:14px;max-width:260px;text-align:center;filter:drop-shadow(0 6px 16px rgba(0,0,0,.4))}
  #bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:14px;height:14px;background:#fff;transform:translateX(-50%) rotate(45deg)}
  #bubble.on{opacity:1}

  #scare{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:#000;display:flex;align-items:center;justify-content:center;--sx:0deg}
  #scare img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.08) rotate(var(--sx));filter:contrast(1.25) saturate(1.3)}
  #scare.on{opacity:1}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-9px,6px)}40%{transform:translate(8px,-7px)}60%{transform:translate(-6px,-5px)}80%{transform:translate(7px,8px)}}
  body.shake #gl, body.shake #ui{animation:shake .32s linear}
  @media (prefers-reduced-motion:reduce){ body.shake #gl, body.shake #ui{animation:none} }
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:40;background:var(--lime);color:#111;font-size:12px;letter-spacing:.2em;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}

  #loader{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;transition:opacity .6s}
  #loader.off{opacity:0;pointer-events:none}
  #loader .dot{width:10px;height:10px;border-radius:50%;background:var(--lime);animation:breathe 1s ease-in-out infinite}
  #loader .t{font-size:11px;letter-spacing:.3em;color:var(--mute)}

  @media (max-width:640px){
    .bar{height:9vh}
    #brand{top:12px}
    #brand small{display:none}
    #meter{top:62px;right:14px}
    #meter .seg{width:22px;height:12px}
    #meter .hint{display:none}
    #snd{left:14px}
    body.live #snd{top:14px}
    #sober{left:14px;bottom:14px}
    #dock{bottom:64px;gap:8px}
    #ca{padding:10px 12px;font-size:12px}
    .dock-btn{padding:10px 14px;font-size:11px}
    #title h1{font-size:18vw}
    #enter{bottom:14vh}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="trail"></canvas>

<div id="loader"><div class="dot"></div><div class="t">LOADING THE YARD</div></div>

<div class="bar top"></div><div class="bar bot"></div>
<div id="black"><div class="line" id="line"></div></div>
<div id="flash"></div>
<div id="cap"></div>
<div id="title"><h1>TRIPPED</h1><div class="tick">$TRIP</div></div>
<div id="enter"><button class="pill big" id="enterBtn">enter the trip <span class="kbd">↵</span></button></div>
<button id="skip">SKIP</button>
<button id="snd">♪ SOUND OFF</button>

<div id="ui">
  <div id="brand" class="wob">TRIPPED<small>HE ATE THE WHOLE THING</small></div>
  <div id="meter" class="wob">
    <div class="lab">TRIP LEVEL</div>
    <div class="segs" id="segs"><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div></div>
    <div class="hint">SCROLL TO GO DEEPER · DRAG TO LOOK · CLICK THE DOG</div>
  </div>
  <div id="dock" class="wob">
    <button id="ca"><span class="k">CA</span><span class="v" id="caV">soon</span><span class="cp" id="caC">COPY</span></button>
    <a class="dock-btn buy" id="buy" href="#" target="_blank" rel="noopener">buy</a>
    <a class="dock-btn" id="chart" href="#" target="_blank" rel="noopener">chart</a>
    <a class="dock-btn" id="xlink" href="#" target="_blank" rel="noopener">x</a>
  </div>
  <button id="sober">SOBER UP (ESC)</button>
</div>
<div id="scare"><img alt=""></div>
<div id="bubble"></div>
<div id="toast">COPIED</div>
